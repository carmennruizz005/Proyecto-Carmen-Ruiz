html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Rosa Encantadora</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Fredoka & Poppins -->
    <lin<!DOCTYPE html>
<k rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Configuración de fuentes */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffe4e6 0%, #fbcfe8 50%, #f472b6 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        h1, h2, .font-title {
            font-family: 'Fredoka', cursive;
        }

        /* Animación de los corazones flotantes de fondo */
        .heart-bg {
            position: absolute;
            color: rgba(244, 114, 182, 0.4);
            user-select: none;
            pointer-events: none;
            animation: floatUp var(--duration, 8s) linear infinite;
            bottom: -50px;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-105vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        /* Animación para los corazones interactivos al hacer clic */
        .click-heart {
            position: fixed;
            pointer-events: none;
            animation: burst 1.2s ease-out forwards;
            z-index: 50;
        }

        @keyframes burst {
            0% {
                transform: translate(-50%, -50%) scale(0.3) rotate(0deg);
                opacity: 1;
            }
            50% {
                opacity: 0.9;
            }
            100% {
                transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.5) rotate(var(--rot));
                opacity: 0;
            }
        }

        /* Efecto de brillo en el contenedor */
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px rgba(244, 114, 182, 0.25);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Contenedor para los corazones flotantes del fondo -->
    <div id="hearts-container" class="fixed inset-0 overflow-hidden pointer-events-none z-0"></div>

    <!-- Tarjeta Principal Interactiva -->
    <main class="glass-card relative z-10 max-w-lg w-full rounded-3xl p-8 md:p-10 text-center transition-all duration-300 hover:shadow-2xl">
        <!-- Ícono decorativo con animación pulso -->
        <div class="inline-block p-4 bg-pink-100 text-pink-500 rounded-full mb-4 animate-bounce shadow-inner">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 fill-current" viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </div>

        <!-- Título Encantador -->
        <h1 class="font-title text-4xl md:text-5xl font-bold text-pink-600 mb-3 tracking-wide drop-shadow-sm">
            ¡Hola, Bonita! ✨
        </h1>

        <!-- Subtítulo / Mensaje -->
        <p class="text-pink-800 text-lg md:text-xl font-light mb-6 leading-relaxed">
            Bienvenida a tu rincón especial. ¡Disfruta de este video especial para ti! 💕
        </p>

        <!-- Contenedor de Video de YouTube -->
        <div class="relative w-full aspect-video rounded-2xl overflow-hidden shadow-lg border-4 border-white mb-6">
            <iframe 
                class="w-full h-full"
                src="https://www.youtube.com/embed/d5JwnNs_0Q4" 
                title="Programa de Protección de Dikys: El metricorto" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>

        <!-- Botón Interactivo con Efecto de Corazones -->
        <div class="space-y-4">
            <button id="love-btn" class="font-title bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white text-xl font-semibold px-8 py-4 rounded-full shadow-lg hover:shadow-pink-300/50 transform hover:-translate-y-1 active:translate-y-0 transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-pink-300 flex items-center justify-center gap-2 mx-auto">
                <span>¡Envía Mucho Amor!</span>
                <span class="text-2xl">💖</span>
            </button>
            <p id="counter-text" class="text-sm font-medium text-pink-500 opacity-80">
                Corazones enviados: <span id="count" class="font-bold">0</span>
            </p>
        </div>
    </main>

    <script>
        // --- 1. Generación de Corazones Flotantes Continuos en el Fondo ---
        const heartsContainer = document.getElementById('hearts-container');
        const heartSymbols = ['💖', '🌸', '✨', '💕', '💗', '❤️'];

        function createBackgroundHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            
            // Selección aleatoria de emoji de corazón o flor
            heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            
            // Posición horizontal aleatoria
            heart.style.left = Math.random() * 100 + 'vw';
            
            // Tamaño aleatorio
            const size = Math.random() * 1.5 + 1; // Entre 1rem y 2.5rem
            heart.style.fontSize = `${size}rem`;
            
            // Duración de la animación aleatoria entre 6s y 12s
            const duration = Math.random() * 6 + 6;
            heart.style.setProperty('--duration', `${duration}s`);
            
            heartsContainer.appendChild(heart);

            // Eliminar el elemento una vez que termina la animación para liberar memoria
            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        // Crear corazones de fondo a un intervalo regular
        setInterval(createBackgroundHeart, 400);

        // --- 2. Efecto de Ráfaga de Corazones al Hacer Clic en el Botón ---
        const loveBtn = document.getElementById('love-btn');
        const countSpan = document.getElementById('count');
        let heartCount = 0;

        loveBtn.addEventListener('click', (e) => {
            // Incrementar contador
            heartCount += 12;
            countSpan.textContent = heartCount;

            // Obtener la posición exacta del clic
            const rect = loveBtn.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            // Disparar 14 corazones proyectados en direcciones aleatorias
            for (let i = 0; i < 14; i++) {
                createExplosionHeart(centerX, centerY);
            }
        });

        function createExplosionHeart(x, y) {
            const heart = document.createElement('div');
            heart.classList.add('click-heart');
            heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];

            // Posición inicial
            heart.style.left = `${x}px`;
            heart.style.top = `${y}px`;
            heart.style.fontSize = `${Math.random() * 1.2 + 1.2}rem`;

            // Calcular distancia de dispersión (dirección X y Y aleatorias)
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 120 + 60; // Distancia de salida
            const dx = `${Math.cos(angle) * distance}px`;
            const dy = `${Math.sin(angle) * distance}px`;
            const rot = `${(Math.random() - 0.5) * 360}deg`;

            heart.style.setProperty('--dx', dx);
            heart.style.setProperty('--dy', dy);
            heart.style.setProperty('--rot', rot);

            document.body.appendChild(heart);

            // Eliminar después de que termina la animación (1.2s)
            setTimeout(() => {
                heart.remove();
            }, 1200);
        }
    </script>
</body>
</html>
